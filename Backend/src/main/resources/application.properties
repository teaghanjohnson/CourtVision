spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nba_stats}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Never let the app mutate the schema on startup. Use "validate" to fail fast if
# the entities and the live schema have drifted; set DDL_AUTO=none to skip the check.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
# Don't hold a DB connection open for the whole request/response cycle.
spring.jpa.open-in-view=false

# Don't leak internals in error responses.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Allowed browser origins for CORS (comma-separated). Override in production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
